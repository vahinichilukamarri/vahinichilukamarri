<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="LedgerGuard architecture: idempotency gate, double-entry ledger and transactional outbox in one PostgreSQL transaction, Kafka, dedup consumer, anomaly engine, LLM explainer, ops console">
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .box{fill:#111427;stroke:#3B2F7A;stroke-width:1.2}
    .hot{fill:#17123A;stroke:#A78BFA;stroke-width:1.6}
    .t{font-size:14.5px;font-weight:700;fill:#F0EEFF}
    .s{font-size:11px;fill:#94A3B8}
    .wire{stroke:#5B4B9E;stroke-width:1.6;fill:none}
    .pg{stroke:#38BDF8;stroke-width:1.2;fill:none;stroke-dasharray:5 4;animation:flow 3s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-36}}
    .flick{animation:flick 2.6s infinite}
    @keyframes flick{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.25}50%{opacity:1}53%{opacity:.4}55%{opacity:1}}
    .glowbox{animation:gb 3.2s ease-in-out infinite}
    @keyframes gb{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0C18"/><stop offset="1" stop-color="#140F33"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C6BD6"/></marker>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1000" height="330" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="999" height="329" rx="18" fill="none" stroke="#A78BFA" stroke-opacity=".22"/>

  <text class="mono" x="30" y="34" font-size="13" fill="#A78BFA" letter-spacing="2">LEDGERGUARD · WRITE PATH → INTEGRITY PATH</text>
  <text class="mono" x="970" y="34" font-size="12" fill="#64748B" text-anchor="end">java · spring boot · postgresql · kafka</text>

  <!-- one-transaction bracket -->
  <rect class="pg" x="400" y="58" width="370" height="84" rx="12"/>
  <text class="mono" x="585" y="158" font-size="11" fill="#38BDF8" text-anchor="middle">[ one PostgreSQL transaction — all or nothing ]</text>

  <!-- row 1 -->
  <g class="sans">
    <rect class="box" x="30"  y="70" width="160" height="60" rx="10"/>
    <text class="t" x="110" y="96" text-anchor="middle">Client / API</text>
    <text class="s" x="110" y="115" text-anchor="middle">REST · Spring Boot</text>

    <rect class="hot glowbox" x="220" y="70" width="160" height="60" rx="10"/>
    <text class="t" x="300" y="96" text-anchor="middle">Idempotency Gate</text>
    <text class="s" x="300" y="115" text-anchor="middle">byte-identical replay</text>

    <rect class="box" x="410" y="70" width="160" height="60" rx="10"/>
    <text class="t" x="490" y="96" text-anchor="middle">Double-Entry Ledger</text>
    <text class="s" x="490" y="115" text-anchor="middle">Σdebit = Σcredit / ccy</text>

    <rect class="box" x="600" y="70" width="160" height="60" rx="10"/>
    <text class="t" x="680" y="96" text-anchor="middle">Transactional Outbox</text>
    <text class="s" x="680" y="115" text-anchor="middle">publish after commit</text>

    <rect class="box" x="810" y="70" width="160" height="60" rx="10"/>
    <text class="t" x="890" y="96" text-anchor="middle">Kafka</text>
    <text class="s" x="890" y="115" text-anchor="middle">event stream</text>

    <!-- row 2 -->
    <rect class="hot glowbox" x="810" y="200" width="160" height="60" rx="10"/>
    <text class="t" x="890" y="226" text-anchor="middle">Dedup Consumer</text>
    <text class="s" x="890" y="245" text-anchor="middle">exactly-one effect</text>

    <rect class="box" x="610" y="200" width="170" height="60" rx="10"/>
    <text class="t" x="695" y="226" text-anchor="middle">Anomaly Engine</text>
    <text class="s" x="695" y="245" text-anchor="middle">stats + Isolation Forest</text>

    <rect class="box" x="420" y="200" width="160" height="60" rx="10"/>
    <text class="t" x="500" y="226" text-anchor="middle">LLM Explainer</text>
    <text class="s" x="500" y="245" text-anchor="middle">grounded, per account</text>

    <rect class="box" x="230" y="200" width="160" height="60" rx="10"/>
    <text class="t" x="310" y="226" text-anchor="middle">Ops Console</text>
    <text class="s" x="310" y="245" text-anchor="middle">React · TypeScript</text>

    <g class="flick">
      <rect x="30" y="200" width="170" height="60" rx="10" fill="#1A0F24" stroke="#F472B6" stroke-dasharray="4 4"/>
      <text class="t" x="115" y="226" text-anchor="middle" fill="#F9A8D4" style="fill:#F9A8D4">Chaos Harness</text>
      <text class="s" x="115" y="245" text-anchor="middle">jqwik · fault injection</text>
    </g>
  </g>

  <!-- wires -->
  <path class="wire" d="M190 100H218" marker-end="url(#ah)"/>
  <path class="wire" d="M380 100H408" marker-end="url(#ah)"/>
  <path class="wire" d="M570 100H598" marker-end="url(#ah)"/>
  <path class="wire" d="M760 100H808" marker-end="url(#ah)"/>
  <path class="wire" d="M890 130V198" marker-end="url(#ah)"/>
  <path class="wire" d="M810 230H782" marker-end="url(#ah)"/>
  <path class="wire" d="M610 230H582" marker-end="url(#ah)"/>
  <path class="wire" d="M420 230H392" marker-end="url(#ah)"/>
  <path d="M115 200V178H890" stroke="#F472B6" stroke-opacity=".5" stroke-dasharray="3 5" fill="none"/>
  <text class="mono" x="460" y="173" font-size="10.5" fill="#F472B6" fill-opacity=".85" text-anchor="middle">breaks JDBC · broker · clock on purpose</text>

  <!-- packets -->
  <g filter="url(#glow)">
    <circle r="4.5" fill="#FFFFFF">
      <animateMotion dur="5s" repeatCount="indefinite" path="M110 100H890V230H310"/>
    </circle>
    <circle r="4" fill="#38BDF8">
      <animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" path="M110 100H890V230H310"/>
    </circle>
    <circle r="4" fill="#A78BFA">
      <animateMotion dur="5s" begin="3.4s" repeatCount="indefinite" path="M110 100H890V230H310"/>
    </circle>
    <!-- duplicate request bounced at the gate -->
    <circle r="4.5" fill="#F43F5E">
      <animateMotion dur="2.5s" begin=".8s" repeatCount="indefinite" path="M110 100H222H140"/>
      <animate attributeName="opacity" values="1;1;0" dur="2.5s" begin=".8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text class="mono" x="205" y="62" font-size="10.5" fill="#F43F5E" text-anchor="middle">
    duplicate × replayed, not re-applied
    <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" begin=".8s" repeatCount="indefinite"/>
  </text>

  <text class="sans" x="500" y="304" font-size="12.5" fill="#94A3B8" text-anchor="middle">Retries, duplicates and crashes are expected — the ledger never ends up half-written, and every event has exactly one effect.</text>
</svg>
