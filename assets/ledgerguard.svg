<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="LedgerGuard architecture: idempotency gate, double-entry ledger and transactional outbox in one PostgreSQL transaction, Kafka, dedup consumer, anomaly engine, LLM explainer, ops console, chaos harness">
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .box{fill:url(#glass);stroke:url(#edge);stroke-width:1.3}
    .hot{fill:url(#glass);stroke:#A78BFA;stroke-width:1.8}
    .t{font-size:14.5px;font-weight:700;fill:#F0EEFF}
    .s{font-size:11px;fill:#94A3B8}
    .wire{stroke:#5B4B9E;stroke-width:1.6;fill:none}
    .badge{fill:#0B0D1C;stroke-width:1.4}
    .ic{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .pg{stroke:#38BDF8;stroke-width:1.3;fill:#38BDF8;fill-opacity:.035;stroke-dasharray:6 5;animation:flow 3s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-44}}
    .flick{animation:flick 2.8s infinite}
    @keyframes flick{0%,100%{opacity:1}44%{opacity:1}46%{opacity:.3}48%{opacity:1}51%{opacity:.45}53%{opacity:1}}
    .glowbox{animation:gb 3.2s ease-in-out infinite}
    @keyframes gb{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
    .zero{animation:zero 2s ease-in-out infinite}
    @keyframes zero{0%,100%{opacity:.55}50%{opacity:1}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080A16"/><stop offset="1" stop-color="#160F38"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1840"/><stop offset="1" stop-color="#0E1024"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D5BD0"/><stop offset="1" stop-color="#1E3A5F"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity=".06"/></pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C6BD6"/></marker>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1000" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="340" rx="20" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="999" height="339" rx="20" fill="none" stroke="#A78BFA" stroke-opacity=".25"/>

  <!-- header -->
  <rect x="28" y="20" width="132" height="24" rx="12" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".5"/>
  <text class="mono" x="94" y="36" font-size="11.5" font-weight="700" fill="#DDD6FE" text-anchor="middle" letter-spacing="1.5">LEDGERGUARD</text>
  <text class="mono" x="172" y="36" font-size="12" fill="#94A3B8">write path → integrity path</text>
  <text class="mono" x="972" y="36" font-size="11.5" fill="#64748B" text-anchor="end">java · spring boot · postgresql · kafka</text>

  <!-- one-transaction zone -->
  <rect class="pg" x="398" y="62" width="374" height="90" rx="14"/>
  <text class="mono" x="585" y="168" font-size="11" fill="#38BDF8" text-anchor="middle">[ one PostgreSQL transaction — all or nothing ]</text>

  <g class="sans">
    <!-- row 1 -->
    <rect class="box" x="30" y="76" width="160" height="62" rx="11"/>
    <text class="t" x="110" y="103" text-anchor="middle">Client / API</text>
    <text class="s" x="110" y="122" text-anchor="middle">REST · Spring Boot</text>

    <rect class="hot glowbox" x="220" y="76" width="160" height="62" rx="11"/>
    <text class="t" x="300" y="103" text-anchor="middle">Idempotency Gate</text>
    <text class="s" x="300" y="122" text-anchor="middle">byte-identical replay</text>

    <rect class="box" x="410" y="76" width="160" height="62" rx="11"/>
    <text class="t" x="490" y="103" text-anchor="middle">Double-Entry Ledger</text>
    <text class="mono" x="490" y="123" font-size="10.5" fill="#94A3B8" text-anchor="middle">Σdebit − Σcredit = <tspan fill="#4ADE80">0</tspan></text>

    <rect class="box" x="600" y="76" width="160" height="62" rx="11"/>
    <text class="t" x="680" y="103" text-anchor="middle">Transactional Outbox</text>
    <text class="s" x="680" y="122" text-anchor="middle">publish after commit</text>

    <rect class="box" x="810" y="76" width="160" height="62" rx="11"/>
    <text class="t" x="890" y="103" text-anchor="middle">Kafka</text>
    <!-- stream lanes -->
    <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7">
      <path d="M850 115H930"><animate attributeName="stroke-dashoffset" values="0;-26" dur="1s" repeatCount="indefinite"/></path>
      <path d="M850 123H930" stroke-opacity=".55"><animate attributeName="stroke-dashoffset" values="-8;-34" dur="1.4s" repeatCount="indefinite"/></path>
    </g>

    <!-- row 2 -->
    <rect class="hot glowbox" x="810" y="210" width="160" height="62" rx="11"/>
    <text class="t" x="890" y="237" text-anchor="middle">Dedup Consumer</text>
    <text class="s" x="890" y="256" text-anchor="middle">exactly-one effect</text>

    <rect class="box" x="610" y="210" width="170" height="62" rx="11"/>
    <text class="t" x="695" y="237" text-anchor="middle">Anomaly Engine</text>
    <text class="s" x="695" y="256" text-anchor="middle">stats + Isolation Forest</text>

    <rect class="box" x="420" y="210" width="160" height="62" rx="11"/>
    <text class="t" x="500" y="237" text-anchor="middle">LLM Explainer</text>
    <text class="s" x="500" y="256" text-anchor="middle">grounded, per account</text>

    <rect class="box" x="230" y="210" width="160" height="62" rx="11"/>
    <text class="t" x="310" y="237" text-anchor="middle">Ops Console</text>
    <text class="s" x="310" y="256" text-anchor="middle">React · TypeScript</text>

    <g class="flick">
      <rect x="30" y="210" width="170" height="62" rx="11" fill="#1C0E26" stroke="#F472B6" stroke-dasharray="4 4"/>
      <text class="t" x="115" y="237" text-anchor="middle" style="fill:#F9A8D4">Chaos Harness</text>
      <text class="s" x="115" y="256" text-anchor="middle">jqwik · fault injection</text>
    </g>
  </g>

  <!-- icon badges -->
  <g>
    <circle class="badge" cx="46" cy="76" r="12" stroke="#A78BFA"/>
    <path class="ic" stroke="#A78BFA" d="M40 76H52M48 72L52 76L48 80"/>

    <circle class="badge" cx="236" cy="76" r="12" stroke="#C4B5FD"/>
    <path class="ic" stroke="#C4B5FD" d="M236 70L241 72V76C241 79 239 81 236 82C233 81 231 79 231 76V72Z"/>

    <circle class="badge" cx="426" cy="76" r="12" stroke="#4ADE80"/>
    <path class="ic" stroke="#4ADE80" d="M420 72H432M420 76H432M420 80H432"/>

    <circle class="badge" cx="616" cy="76" r="12" stroke="#38BDF8"/>
    <path class="ic" stroke="#38BDF8" d="M610 72H622V80H610Z M610 72L616 77L622 72"/>

    <circle class="badge" cx="826" cy="76" r="12" stroke="#38BDF8"/>
    <path class="ic" stroke="#38BDF8" d="M819 73H833M819 79H833"/><circle cx="823" cy="73" r="1.6" fill="#38BDF8"/><circle cx="829" cy="79" r="1.6" fill="#38BDF8"/>

    <circle class="badge" cx="826" cy="210" r="12" stroke="#C4B5FD"/>
    <path class="ic" stroke="#C4B5FD" d="M821 210L824.5 213.5L831 206.5"/>

    <circle class="badge" cx="626" cy="210" r="12" stroke="#FBBF24"/>
    <path class="ic" stroke="#FBBF24" d="M619 212H622L624.5 205L627.5 215L629.5 210H633"/>

    <circle class="badge" cx="436" cy="210" r="12" stroke="#F472B6"/>
    <path fill="#F472B6" d="M436 203.5L437.6 208.4L442.5 210L437.6 211.6L436 216.5L434.4 211.6L429.5 210L434.4 208.4Z"/>

    <circle class="badge" cx="246" cy="210" r="12" stroke="#A78BFA"/>
    <path class="ic" stroke="#A78BFA" d="M240 205H252V213H240Z M244 216H248"/>

    <circle class="badge" cx="46" cy="210" r="12" stroke="#F472B6"/>
    <path fill="#F472B6" d="M47.5 203L41.5 211H45.5L44.5 217L50.5 209H46.5Z"/>
  </g>

  <!-- wires -->
  <path class="wire" d="M190 107H218" marker-end="url(#ah)"/>
  <path class="wire" d="M380 107H408" marker-end="url(#ah)"/>
  <path class="wire" d="M570 107H598" marker-end="url(#ah)"/>
  <path class="wire" d="M760 107H808" marker-end="url(#ah)"/>
  <path class="wire" d="M890 138V196" marker-end="url(#ah)"/>
  <path class="wire" d="M810 241H782" marker-end="url(#ah)"/>
  <path class="wire" d="M610 241H582" marker-end="url(#ah)"/>
  <path class="wire" d="M420 241H392" marker-end="url(#ah)"/>
  <path d="M115 208V186H860" stroke="#F472B6" stroke-opacity=".5" stroke-dasharray="3 5" fill="none"/>
  <text class="mono" x="460" y="182" font-size="10.5" fill="#F472B6" fill-opacity=".85" text-anchor="middle">breaks JDBC · broker · clock on purpose</text>

  <!-- packets with comet tails -->
  <g filter="url(#glow)">
    <circle r="4.6" fill="#FFFFFF"><animateMotion dur="5s" repeatCount="indefinite" path="M110 107H890V241H310"/></circle>
    <circle r="3" fill="#FFFFFF" opacity=".45"><animateMotion dur="5s" begin=".09s" repeatCount="indefinite" path="M110 107H890V241H310"/></circle>
    <circle r="1.8" fill="#FFFFFF" opacity=".22"><animateMotion dur="5s" begin=".18s" repeatCount="indefinite" path="M110 107H890V241H310"/></circle>

    <circle r="4.2" fill="#38BDF8"><animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" path="M110 107H890V241H310"/></circle>
    <circle r="2.6" fill="#38BDF8" opacity=".45"><animateMotion dur="5s" begin="1.79s" repeatCount="indefinite" path="M110 107H890V241H310"/></circle>

    <circle r="4.2" fill="#A78BFA"><animateMotion dur="5s" begin="3.4s" repeatCount="indefinite" path="M110 107H890V241H310"/></circle>
    <circle r="2.6" fill="#A78BFA" opacity=".45"><animateMotion dur="5s" begin="3.49s" repeatCount="indefinite" path="M110 107H890V241H310"/></circle>

    <!-- duplicate request bounced at the gate -->
    <circle r="4.6" fill="#F43F5E">
      <animateMotion dur="2.5s" begin=".8s" repeatCount="indefinite" path="M110 107H222H140"/>
      <animate attributeName="opacity" values="1;1;0" dur="2.5s" begin=".8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text class="mono" x="168" y="57" font-size="10" fill="#F43F5E" text-anchor="middle">dup × replayed, not re-applied<animate attributeName="opacity" values="0;1;1;0" dur="2.5s" begin=".8s" repeatCount="indefinite"/></text>

  <text class="sans" x="500" y="310" font-size="12.5" fill="#94A3B8" text-anchor="middle">Retries, duplicates and crashes are expected — the ledger never ends up half-written, and every event has exactly one effect.</text>
</svg>
