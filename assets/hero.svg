<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Venkata Vahini Chilukamarri — Backend, Distributed Systems, AI Engineering">
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .in{animation:in 1s cubic-bezier(.2,.8,.2,1) both}
    .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}.d5{animation-delay:.95s}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .star{animation:tw 3.2s ease-in-out infinite}
    .s2{animation-delay:.8s}.s3{animation-delay:1.6s}.s4{animation-delay:2.4s}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
    .node{animation:pulse 3s ease-in-out infinite}
    .n2{animation-delay:.5s}.n3{animation-delay:1s}.n4{animation-delay:1.5s}.n5{animation-delay:2s}.n6{animation-delay:2.5s}
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    .edge{stroke-dasharray:4 6;animation:flow 2.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-40}}
    .underline{stroke-dasharray:440;animation:draw 1.6s cubic-bezier(.6,0,.2,1) .6s both}
    @keyframes draw{from{stroke-dashoffset:440}to{stroke-dashoffset:0}}
    .beam{animation:beam 7s linear infinite}
    @keyframes beam{from{transform:translateX(-260px)}to{transform:translateX(1160px)}}
    .live{animation:live 1.6s ease-in-out infinite}
    @keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070914"/><stop offset=".5" stop-color="#120F33"/><stop offset="1" stop-color="#2A0E5E"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="560" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#DDD6FE"/><stop offset=".45" stop-color="#38BDF8"/><stop offset="1" stop-color="#F472B6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#C4B5FD" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fade" cx=".5" cy=".5" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1000" height="340" fill="url(#fade)"/></mask>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity=".06"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1000" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="340" fill="url(#bg)"/>
    <rect width="1000" height="340" fill="url(#grid)" mask="url(#gridmask)"/>

    <!-- aurora -->
    <ellipse cx="820" cy="100" rx="190" ry="130" fill="#7C3AED" opacity=".42" filter="url(#blur)">
      <animate attributeName="cx" values="800;860;800" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="120;150;120" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="160" cy="340" rx="200" ry="110" fill="#0EA5E9" opacity=".24" filter="url(#blur)">
      <animate attributeName="cx" values="120;260;120" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="560" cy="0" rx="160" ry="70" fill="#DB2777" opacity=".18" filter="url(#blur)">
      <animate attributeName="cx" values="520;620;520" dur="9s" repeatCount="indefinite"/>
    </ellipse>

    <!-- stars -->
    <g fill="#FFFFFF">
      <circle class="star" cx="612" cy="40" r="1.2"/><circle class="star s2" cx="960" cy="296" r="1.4"/>
      <circle class="star s3" cx="540" cy="300" r="1"/><circle class="star s4" cx="980" cy="60" r="1.1"/>
      <circle class="star s2" cx="645" cy="160" r="1"/><circle class="star" cx="430" cy="34" r="1.3"/>
      <circle class="star s3" cx="900" cy="18" r="1"/><circle class="star s4" cx="590" cy="212" r="1.2"/>
      <circle class="star" cx="745" cy="300" r="1"/><circle class="star s2" cx="300" cy="22" r="1"/>
      <circle class="star s3" cx="985" cy="190" r="1.2"/><circle class="star s4" cx="700" cy="20" r="1"/>
    </g>

    <!-- sweeping light beam -->
    <rect class="beam" x="0" y="0" width="220" height="340" fill="url(#beamg)"/>

    <!-- distributed-system constellation -->
    <g stroke="#A78BFA" stroke-opacity=".55" stroke-width="1.4" fill="none">
      <path class="edge" d="M700 105 L820 72"/>
      <path class="edge" d="M820 72 L925 145"/>
      <path class="edge" d="M700 105 L765 202"/>
      <path class="edge" d="M765 202 L925 145"/>
      <path class="edge" d="M765 202 L880 258"/>
      <path class="edge" d="M925 145 L880 258"/>
      <path class="edge" d="M765 202 L670 262"/>
      <path class="edge" d="M670 262 L880 258"/>
    </g>
    <!-- ripples -->
    <g fill="none" stroke-width="1.5">
      <circle cx="765" cy="202" r="10" stroke="#C4B5FD">
        <animate attributeName="r" values="10;34" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;0" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="925" cy="145" r="8" stroke="#F472B6">
        <animate attributeName="r" values="8;28" dur="2.6s" begin=".9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;0" dur="2.6s" begin=".9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="72" r="6" stroke="#38BDF8">
        <animate attributeName="r" values="6;24" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;0" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g filter="url(#glow)">
      <circle class="node" cx="700" cy="105" r="7" fill="#A78BFA"/>
      <circle class="node n2" cx="820" cy="72" r="6" fill="#38BDF8"/>
      <circle class="node n3" cx="925" cy="145" r="8" fill="#F472B6"/>
      <circle class="node n4" cx="765" cy="202" r="10" fill="#DDD6FE"/>
      <circle class="node n5" cx="880" cy="258" r="6" fill="#38BDF8"/>
      <circle class="node n6" cx="670" cy="262" r="6" fill="#A78BFA"/>
    </g>
    <g class="mono" font-size="11" fill="#A5B4FC" fill-opacity=".8">
      <text x="682" y="90">api</text>
      <text x="804" y="56">ledger</text>
      <text x="939" y="149">kafka</text>
      <text x="783" y="206">agent</text>
      <text x="893" y="276">ops</text>
      <text x="628" y="285">otel</text>
    </g>
    <!-- packets with comet tails -->
    <g filter="url(#glow)">
      <circle r="3.8" fill="#FFFFFF"><animateMotion dur="5s" repeatCount="indefinite" path="M700 105 L820 72 L925 145 L880 258 L670 262 L765 202 L700 105"/></circle>
      <circle r="2.6" fill="#FFFFFF" opacity=".5"><animateMotion dur="5s" begin=".08s" repeatCount="indefinite" path="M700 105 L820 72 L925 145 L880 258 L670 262 L765 202 L700 105"/></circle>
      <circle r="1.6" fill="#FFFFFF" opacity=".25"><animateMotion dur="5s" begin=".16s" repeatCount="indefinite" path="M700 105 L820 72 L925 145 L880 258 L670 262 L765 202 L700 105"/></circle>
      <circle r="3.2" fill="#38BDF8"><animateMotion dur="4s" begin="1.2s" repeatCount="indefinite" path="M765 202 L925 145 L820 72 L700 105 L765 202"/></circle>
      <circle r="2" fill="#38BDF8" opacity=".4"><animateMotion dur="4s" begin="1.28s" repeatCount="indefinite" path="M765 202 L925 145 L820 72 L700 105 L765 202"/></circle>
      <circle r="3.2" fill="#F472B6"><animateMotion dur="3.4s" begin=".6s" repeatCount="indefinite" path="M670 262 L880 258 L765 202 L670 262"/></circle>
      <circle r="2" fill="#F472B6" opacity=".4"><animateMotion dur="3.4s" begin=".68s" repeatCount="indefinite" path="M670 262 L880 258 L765 202 L670 262"/></circle>
    </g>

    <!-- status pill -->
    <g class="in">
      <rect x="60" y="34" width="300" height="26" rx="13" fill="#0F172A" fill-opacity=".7" stroke="#4ADE80" stroke-opacity=".45"/>
      <circle class="live" cx="76" cy="47" r="4" fill="#4ADE80"/>
      <text class="mono" x="88" y="51.5" font-size="12" fill="#BBF7D0">open to SWE · Backend · AI roles</text>
    </g>

    <!-- name -->
    <text class="sans in d1" x="58" y="128" font-size="58" font-weight="800" fill="url(#name)" letter-spacing="-1">Venkata Vahini</text>
    <text class="sans in d2" x="58" y="190" font-size="58" font-weight="800" fill="url(#name)" letter-spacing="-1">Chilukamarri</text>
    <path class="underline" d="M62 210 H500" stroke="url(#line)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- role chips -->
    <g class="sans in d3" font-size="14" fill="#E2E8F0">
      <rect x="60" y="228" width="112" height="30" rx="15" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".5"/>
      <circle cx="76" cy="243" r="4" fill="#A78BFA"/><text x="87" y="248">Backend</text>
      <rect x="182" y="228" width="190" height="30" rx="15" fill="#38BDF8" fill-opacity=".12" stroke="#38BDF8" stroke-opacity=".5"/>
      <circle cx="198" cy="243" r="4" fill="#38BDF8"/><text x="209" y="248">Distributed Systems</text>
      <rect x="382" y="228" width="160" height="30" rx="15" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".5"/>
      <circle cx="398" cy="243" r="4" fill="#F472B6"/><text x="409" y="248">AI Engineering</text>
    </g>

    <!-- terminal line -->
    <text class="mono in d4" x="60" y="298" font-size="14"><tspan fill="#F472B6">vahini@kmit</tspan><tspan fill="#64748B">:~$ </tspan><tspan fill="#38BDF8">ship --idempotent --observable --intelligent</tspan><tspan fill="#38BDF8">_<animate attributeName="fill-opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
  </g>
  <rect x=".5" y=".5" width="999" height="339" rx="22" fill="none" stroke="#A78BFA" stroke-opacity=".28"/>
</svg>
