<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-label="TRACE recovery loop: failed payment, LLM agent, policy layer, bounded execution, reassessment loop, safe fallback; +42% revenue recovered vs rules baseline">
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .box{fill:#111427;stroke:#3B2F7A;stroke-width:1.2}
    .t{font-size:15px;font-weight:700;fill:#F0EEFF}
    .s{font-size:11px;fill:#94A3B8}
    .wire{stroke:#5B4B9E;stroke-width:1.6;fill:none}
    .loop{stroke:#38BDF8;stroke-width:1.6;fill:none;stroke-dasharray:6 5;animation:flow 2.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-44}}
    .brain{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{stroke-opacity:.5}50%{stroke-opacity:1}}
    .v{opacity:0;animation:cycle 6s infinite}
    .v2{animation-delay:2s}.v3{animation-delay:4s}
    @keyframes cycle{0%{opacity:0}5%{opacity:1}30%{opacity:1}36%{opacity:0}100%{opacity:0}}
    .rise{animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both .3s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0C18"/><stop offset="1" stop-color="#0E1A33"/></linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C6BD6"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F472B6"/></marker>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1000" height="310" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="999" height="309" rx="18" fill="none" stroke="#38BDF8" stroke-opacity=".22"/>

  <text class="mono" x="30" y="34" font-size="13" fill="#38BDF8" letter-spacing="2">TRACE · BOUNDED RECOVERY LOOP</text>
  <text class="mono" x="970" y="34" font-size="12" fill="#64748B" text-anchor="end">python · fastapi · react · llm apis</text>

  <g class="sans">
    <rect class="box" x="30" y="80" width="180" height="64" rx="10"/>
    <text class="t" x="120" y="107" text-anchor="middle">Failed Payment</text>
    <text class="s" x="120" y="127" text-anchor="middle">idempotent event intake</text>

    <rect class="box brain" x="250" y="80" width="180" height="64" rx="10" style="stroke:#A78BFA;stroke-width:1.8"/>
    <text class="t" x="340" y="107" text-anchor="middle">LLM Agent</text>
    <text class="s" x="340" y="127" text-anchor="middle">classify · pick from fixed set</text>

    <rect class="box" x="470" y="80" width="180" height="64" rx="10"/>
    <text class="t" x="560" y="107" text-anchor="middle">Policy Layer</text>
    <circle cx="492" cy="102" r="4" fill="#4ADE80"><animate attributeName="fill" values="#4ADE80;#FBBF24;#F43F5E;#4ADE80" dur="6s" calcMode="discrete" repeatCount="indefinite"/></circle>
    <g class="mono" font-size="11.5" font-weight="700" text-anchor="middle">
      <text class="v"    x="560" y="128" fill="#4ADE80">APPROVE</text>
      <text class="v v2" x="560" y="128" fill="#FBBF24">FLAG</text>
      <text class="v v3" x="560" y="128" fill="#F43F5E">BLOCK</text>
    </g>

    <rect class="box" x="690" y="80" width="180" height="64" rx="10"/>
    <text class="t" x="780" y="107" text-anchor="middle">Execute</text>
    <text class="s" x="780" y="127" text-anchor="middle">bounded action set</text>

    <rect x="30" y="226" width="180" height="56" rx="10" fill="#1A0F24" stroke="#F472B6" stroke-dasharray="4 4"/>
    <text class="t" x="120" y="250" text-anchor="middle" style="fill:#F9A8D4">Safe / Flagged</text>
    <text class="s" x="120" y="268" text-anchor="middle">fallback on LLM timeout</text>
  </g>

  <path class="wire" d="M210 112H248" marker-end="url(#ah)"/>
  <path class="wire" d="M430 112H468" marker-end="url(#ah)"/>
  <path class="wire" d="M650 112H688" marker-end="url(#ah)"/>
  <path class="loop" d="M780 144 C780 222, 340 222, 340 146" marker-end="url(#ahb)"/>
  <text class="mono" x="560" y="232" font-size="11.5" fill="#38BDF8" text-anchor="middle">↺ reassess outcome · adapt · stay bounded</text>
  <path d="M290 144 L190 224" stroke="#F472B6" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#ahp)"/>
  <text class="mono" x="262" y="196" font-size="10.5" fill="#F472B6">timeout</text>

  <g filter="url(#glow)">
    <circle r="4.5" fill="#FFFFFF">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M120 112H780 C780 222, 340 222, 340 146"/>
    </circle>
    <circle r="4" fill="#38BDF8">
      <animateMotion dur="4.5s" begin="2.25s" repeatCount="indefinite" path="M120 112H780 C780 222, 340 222, 340 146"/>
    </circle>
  </g>

  <g class="rise">
    <rect x="715" y="216" width="255" height="74" rx="12" fill="#0F1530" stroke="#38BDF8" stroke-opacity=".55"/>
    <text class="sans" x="733" y="258" font-size="32" font-weight="800" fill="url(#num)">+42%</text>
    <text class="sans" x="855" y="246" font-size="11.5" fill="#E2E8F0">revenue recovered</text>
    <text class="sans" x="855" y="262" font-size="11" fill="#94A3B8">vs rules baseline</text>
    <text class="mono" x="733" y="280" font-size="10" fill="#64748B">300 failed txns · +23% recovery rate</text>
  </g>
</svg>
