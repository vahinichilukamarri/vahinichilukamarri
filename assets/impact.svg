<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Impact: +42% revenue recovered, +23% recovery rate, exactly one effect per idempotency key, 9.12 CGPA">
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .tile{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
    .a2{animation-delay:.15s}.a3{animation-delay:.3s}.a4{animation-delay:.45s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .bar{animation:sweep 3.5s ease-in-out infinite}
    .b2{animation-delay:.6s}.b3{animation-delay:1.2s}.b4{animation-delay:1.8s}
    @keyframes sweep{0%{transform:translateX(-80px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(230px);opacity:0}}
    .spark{stroke-dasharray:130;animation:draw 1.8s ease-out .4s both}
    @keyframes draw{from{stroke-dashoffset:130}to{stroke-dashoffset:0}}
    .ring{stroke-dasharray:103.2 113.1;animation:ring 1.8s ease-out .6s both}
    @keyframes ring{from{stroke-dashoffset:103.2}to{stroke-dashoffset:0}}
    .beat{animation:beat 1.6s ease-in-out infinite}
    @keyframes beat{0%,100%{opacity:.65}50%{opacity:1}}
  </style>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDD6FE"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15173A"/><stop offset="1" stop-color="#0B0D1E"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c1"><rect x="10" y="149" width="230" height="3"/></clipPath>
    <clipPath id="c2"><rect x="260" y="149" width="230" height="3"/></clipPath>
    <clipPath id="c3"><rect x="510" y="149" width="230" height="3"/></clipPath>
    <clipPath id="c4"><rect x="760" y="149" width="230" height="3"/></clipPath>
  </defs>

  <!-- 1 · revenue -->
  <g class="tile">
    <rect x="10" y="14" width="230" height="138" rx="15" fill="url(#tile)" stroke="#A78BFA" stroke-opacity=".4"/>
    <text class="sans" x="30" y="76" font-size="40" font-weight="800" fill="url(#g1)">+42%</text>
    <polyline class="spark" points="176,64 186,58 196,61 206,49 215,45 224,32" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle class="beat" cx="224" cy="32" r="3.6" fill="#DDD6FE"/>
    <text class="sans" x="30" y="104" font-size="13" fill="#E2E8F0">more revenue recovered</text>
    <text class="mono" x="30" y="126" font-size="10.5" fill="#64748B">TRACE vs fixed-rules baseline</text>
    <g clip-path="url(#c1)"><rect class="bar" x="10" y="149" width="80" height="3" fill="url(#shine)"/></g>
  </g>

  <!-- 2 · recovery rate -->
  <g class="tile a2">
    <rect x="260" y="14" width="230" height="138" rx="15" fill="url(#tile)" stroke="#38BDF8" stroke-opacity=".4"/>
    <text class="sans" x="280" y="76" font-size="40" font-weight="800" fill="url(#g2)">+23%</text>
    <path d="M410 67H470" stroke="#334155" stroke-width="1"/>
    <rect x="416" y="41" width="16" height="26" rx="3" fill="#475569">
      <animate attributeName="height" values="0;0;26" keyTimes="0;.3;1" dur="1.6s" fill="freeze"/>
      <animate attributeName="y" values="67;67;41" keyTimes="0;.3;1" dur="1.6s" fill="freeze"/>
    </rect>
    <rect x="446" y="35" width="16" height="32" rx="3" fill="url(#g2)">
      <animate attributeName="height" values="0;0;32" keyTimes="0;.35;1" dur="1.9s" fill="freeze"/>
      <animate attributeName="y" values="67;67;35" keyTimes="0;.35;1" dur="1.9s" fill="freeze"/>
    </rect>
    <text class="mono" x="424" y="80" font-size="8" fill="#64748B" text-anchor="middle">rules</text>
    <text class="mono" x="456" y="80" font-size="8" fill="#7DD3FC" text-anchor="middle">TRACE</text>
    <text class="sans" x="280" y="104" font-size="13" fill="#E2E8F0">higher relative recovery rate</text>
    <text class="mono" x="280" y="126" font-size="10.5" fill="#64748B">same 300 failed transactions</text>
    <g clip-path="url(#c2)"><rect class="bar b2" x="260" y="149" width="80" height="3" fill="url(#shine)"/></g>
  </g>

  <!-- 3 · exactly-once -->
  <g class="tile a3">
    <rect x="510" y="14" width="230" height="138" rx="15" fill="url(#tile)" stroke="#F472B6" stroke-opacity=".4"/>
    <text class="sans" x="530" y="76" font-size="40" font-weight="800" fill="url(#g3)">1×</text>
    <g fill="none" stroke="#F472B6" stroke-opacity=".5" stroke-width="1.6">
      <path d="M640 32 Q675 32 700 48"/>
      <path d="M640 64 Q675 64 700 48"/>
    </g>
    <circle r="3" fill="#F9A8D4"><animateMotion dur="1.8s" repeatCount="indefinite" path="M640 32 Q675 32 700 48"/></circle>
    <circle r="3" fill="#F9A8D4"><animateMotion dur="1.8s" repeatCount="indefinite" path="M640 64 Q675 64 700 48"/></circle>
    <circle cx="712" cy="48" r="9" fill="none" stroke="#A78BFA" stroke-width="1.4">
      <animate attributeName="r" values="7;15" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="712" cy="48" r="6" fill="url(#g3)" filter="url(#glow)"/>
    <text class="sans" x="530" y="104" font-size="13" fill="#E2E8F0">effect per idempotency key</text>
    <text class="mono" x="530" y="126" font-size="10.5" fill="#64748B">under concurrent duplicates</text>
    <g clip-path="url(#c3)"><rect class="bar b3" x="510" y="149" width="80" height="3" fill="url(#shine)"/></g>
  </g>

  <!-- 4 · CGPA -->
  <g class="tile a4">
    <rect x="760" y="14" width="230" height="138" rx="15" fill="url(#tile)" stroke="#FBBF24" stroke-opacity=".4"/>
    <text class="sans" x="780" y="76" font-size="40" font-weight="800" fill="url(#g4)">9.12</text>
    <circle cx="942" cy="50" r="18" fill="none" stroke="#2A2F4A" stroke-width="5"/>
    <circle class="ring" cx="942" cy="50" r="18" fill="none" stroke="url(#g4)" stroke-width="5" stroke-linecap="round" transform="rotate(-90 942 50)"/>
    <text class="mono" x="942" y="54" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="middle">/10</text>
    <text class="sans" x="780" y="104" font-size="13" fill="#E2E8F0">CGPA · B.Tech CSE</text>
    <text class="mono" x="780" y="126" font-size="10.5" fill="#64748B">KMIT · class of 2027</text>
    <g clip-path="url(#c4)"><rect class="bar b4" x="760" y="149" width="80" height="3" fill="url(#shine)"/></g>
  </g>
</svg>
